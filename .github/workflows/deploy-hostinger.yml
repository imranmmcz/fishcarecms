name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────────────────────────
  # 1) Build the React frontend and ship dist/ → public_html/
  # ─────────────────────────────────────────────────────────────
  deploy-frontend:
    name: Build & deploy frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        # Reports lint debt but does not block deployment while the codebase is being cleaned up.
        continue-on-error: true
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Write build env
        run: |
          cat > .env.production <<EOF
          VITE_API_URL=${{ secrets.VITE_API_URL }}
          VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY=${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID=${{ secrets.VITE_SUPABASE_PROJECT_ID }}
          EOF

      - name: Build
        run: npm run build

      - name: Verify Vite build output
        run: |
          set -e
          if [ ! -f dist/index.html ]; then
            echo "dist/index.html missing — build failed" >&2
            exit 1
          fi
          if [ ! -d dist/assets ]; then
            echo "dist/assets directory missing — build failed" >&2
            exit 1
          fi
          js_count=$(find dist/assets -name '*.js' | wc -l)
          css_count=$(find dist/assets -name '*.css' | wc -l)
          if [ "$js_count" -lt 1 ] || [ "$css_count" -lt 1 ]; then
            echo "Expected at least one JS and one CSS asset; found JS=$js_count CSS=$css_count" >&2
            exit 1
          fi
          echo "Build verified: dist/index.html, $js_count JS asset(s), $css_count CSS asset(s)"

      - name: Ensure .htaccess is shipped with the build
        run: cp hostinger-backend/.htaccess dist/.htaccess

      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HOSTINGER_SSH_KEY }}

      - name: Trust Hostinger host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.HOSTINGER_SSH_PORT }} -H ${{ secrets.HOSTINGER_SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Test SSH connectivity before rsync
        run: |
          output=$(ssh -p ${{ secrets.HOSTINGER_SSH_PORT }} \
            ${{ secrets.HOSTINGER_SSH_USER }}@${{ secrets.HOSTINGER_SSH_HOST }} \
            "echo ok")
          if [ "$output" != "ok" ]; then
            echo "SSH connectivity test failed" >&2
            exit 1
          fi
          echo "SSH connectivity OK"

      - name: Snapshot current public_html for rollback
        id: snapshot_frontend
        run: |
          BACKUP="${{ secrets.HOSTINGER_PUBLIC_HTML_PATH }}.bak-${GITHUB_RUN_ID}"
          echo "backup_path=$BACKUP" >> "$GITHUB_OUTPUT"
          ssh -p ${{ secrets.HOSTINGER_SSH_PORT }} \
            ${{ secrets.HOSTINGER_SSH_USER }}@${{ secrets.HOSTINGER_SSH_HOST }} \
            "set -e; \
             SRC='${{ secrets.HOSTINGER_PUBLIC_HTML_PATH }}'; \
             DST='$BACKUP'; \
             if [ -d \"\$SRC\" ]; then \
               rm -rf \"\$DST\"; \
               cp -a \"\$SRC\" \"\$DST\"; \
               echo \"Snapshot created at \$DST\"; \
             else \
               echo \"No existing public_html to snapshot — skipping\"; \
             fi"

      - name: Rsync dist/ → public_html/
        id: rsync_frontend
        run: |
          rsync -avz --delete \
            -e "ssh -p ${{ secrets.HOSTINGER_SSH_PORT }}" \
            dist/ \
            ${{ secrets.HOSTINGER_SSH_USER }}@${{ secrets.HOSTINGER_SSH_HOST }}:${{ secrets.HOSTINGER_PUBLIC_HTML_PATH }}/

      - name: Frontend post-deploy health check
        id: health_frontend
        run: |
          sleep 3
          # Verify the deployed index.html is reachable over HTTPS.
          BASE="${{ secrets.VITE_API_URL }}"
          # Strip trailing /api if present to get the site origin.
          ORIGIN="${BASE%/api}"
          curl -fsS -o /dev/null "$ORIGIN/index.html" \
            || curl -fsS -o /dev/null "$ORIGIN/"

      - name: Rollback frontend on failure
        if: failure() && steps.snapshot_frontend.outputs.backup_path != ''
        run: |
          BACKUP="${{ steps.snapshot_frontend.outputs.backup_path }}"
          ssh -p ${{ secrets.HOSTINGER_SSH_PORT }} \
            ${{ secrets.HOSTINGER_SSH_USER }}@${{ secrets.HOSTINGER_SSH_HOST }} \
            "set -e; \
             SRC='${{ secrets.HOSTINGER_PUBLIC_HTML_PATH }}'; \
             DST='$BACKUP'; \
             if [ -d \"\$DST\" ]; then \
               echo 'Restoring previous public_html from snapshot…'; \
               rm -rf \"\$SRC\"; \
               mv \"\$DST\" \"\$SRC\"; \
               echo 'Rollback complete.'; \
             else \
               echo 'No snapshot found — cannot rollback.' >&2; \
               exit 1; \
             fi"

      - name: Cleanup frontend snapshot on success
        if: success() && steps.snapshot_frontend.outputs.backup_path != ''
        run: |
          BACKUP="${{ steps.snapshot_frontend.outputs.backup_path }}"
          ssh -p ${{ secrets.HOSTINGER_SSH_PORT }} \
            ${{ secrets.HOSTINGER_SSH_USER }}@${{ secrets.HOSTINGER_SSH_HOST }} \
            "rm -rf '$BACKUP' && echo 'Snapshot $BACKUP cleaned up'"

  # ─────────────────────────────────────────────────────────────
  # 2) Sync backend folder and PM2-restart on the server
  # ─────────────────────────────────────────────────────────────
  deploy-backend:
    name: Deploy backend (hostinger-backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HOSTINGER_SSH_KEY }}

      - name: Trust Hostinger host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.HOSTINGER_SSH_PORT }} -H ${{ secrets.HOSTINGER_SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Test SSH connectivity before rsync
        run: |
          output=$(ssh -p ${{ secrets.HOSTINGER_SSH_PORT }} \
            ${{ secrets.HOSTINGER_SSH_USER }}@${{ secrets.HOSTINGER_SSH_HOST }} \
            "echo ok")
          if [ "$output" != "ok" ]; then
            echo "SSH connectivity test failed" >&2
            exit 1
          fi
          echo "SSH connectivity OK"

      - name: Snapshot current backend for rollback
        id: snapshot_backend
        run: |
          BACKUP="${{ secrets.HOSTINGER_BACKEND_PATH }}.bak-${GITHUB_RUN_ID}"
          echo "backup_path=$BACKUP" >> "$GITHUB_OUTPUT"
          ssh -p ${{ secrets.HOSTINGER_SSH_PORT }} \
            ${{ secrets.HOSTINGER_SSH_USER }}@${{ secrets.HOSTINGER_SSH_HOST }} \
            "set -e; \
             SRC='${{ secrets.HOSTINGER_BACKEND_PATH }}'; \
             DST='$BACKUP'; \
             if [ -d \"\$SRC\" ]; then \
               rm -rf \"\$DST\"; \
               mkdir -p \"\$DST\"; \
               # Copy everything except heavy/regenerable dirs; .env and uploads ARE preserved so rollback restores them.
               rsync -a --delete \
                 --exclude='node_modules' \
                 --exclude='logs' \
                 \"\$SRC\"/ \"\$DST\"/; \
               echo \"Snapshot created at \$DST\"; \
             else \
               echo \"No existing backend directory to snapshot — skipping\"; \
             fi"

      - name: Rsync hostinger-backend/ → server (preserve .env & uploads)
        id: rsync_backend
        run: |
          rsync -avz --delete \
            --exclude='.env' \
            --exclude='node_modules' \
            --exclude='logs' \
            --exclude='uploads/products/*' \
            --exclude='uploads/avatars/*' \
            --exclude='uploads/general/*' \
            -e "ssh -p ${{ secrets.HOSTINGER_SSH_PORT }}" \
            hostinger-backend/ \
            ${{ secrets.HOSTINGER_SSH_USER }}@${{ secrets.HOSTINGER_SSH_HOST }}:${{ secrets.HOSTINGER_BACKEND_PATH }}/

      - name: Install deps & restart PM2
        id: pm2_restart
        run: |
          ssh -p ${{ secrets.HOSTINGER_SSH_PORT }} \
            ${{ secrets.HOSTINGER_SSH_USER }}@${{ secrets.HOSTINGER_SSH_HOST }} \
            "cd ${{ secrets.HOSTINGER_BACKEND_PATH }} && \
             npm ci --omit=dev && \
             (pm2 restart fishcare-api --update-env || pm2 start ecosystem.config.js --env production) && \
             pm2 save"

      - name: Health check
        id: health_backend
        run: |
          sleep 5
          curl -fsS ${{ secrets.VITE_API_URL }}/health || (echo "Health check failed" && exit 1)

      - name: Rollback backend on failure
        if: failure() && steps.snapshot_backend.outputs.backup_path != ''
        run: |
          BACKUP="${{ steps.snapshot_backend.outputs.backup_path }}"
          ssh -p ${{ secrets.HOSTINGER_SSH_PORT }} \
            ${{ secrets.HOSTINGER_SSH_USER }}@${{ secrets.HOSTINGER_SSH_HOST }} \
            "set -e; \
             SRC='${{ secrets.HOSTINGER_BACKEND_PATH }}'; \
             DST='$BACKUP'; \
             if [ -d \"\$DST\" ]; then \
               echo 'Restoring previous backend from snapshot…'; \
               # Restore code/config/.env/uploads from snapshot. node_modules stays in place (was excluded from snapshot). \
               rsync -a --delete \
                 --exclude='node_modules' \
                 --exclude='logs' \
                 \"\$DST\"/ \"\$SRC\"/; \
               cd \"\$SRC\" && npm ci --omit=dev && \
               (pm2 restart fishcare-api --update-env || pm2 start ecosystem.config.js --env production) && \
               pm2 save; \
               echo 'Backend rollback complete.'; \
             else \
               echo 'No snapshot found — cannot rollback.' >&2; \
               exit 1; \
             fi"

      - name: Cleanup backend snapshot on success
        if: success() && steps.snapshot_backend.outputs.backup_path != ''
        run: |
          BACKUP="${{ steps.snapshot_backend.outputs.backup_path }}"
          ssh -p ${{ secrets.HOSTINGER_SSH_PORT }} \
            ${{ secrets.HOSTINGER_SSH_USER }}@${{ secrets.HOSTINGER_SSH_HOST }} \
            "rm -rf '$BACKUP' && echo 'Snapshot $BACKUP cleaned up'"